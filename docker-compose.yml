# PostgreSQL-вариант запуска. Перед использованием переключите провайдер в
# prisma/schema.prisma на "postgresql" и пересоздайте миграции — см. README.
# Деплой на Fly.io этот файл не использует, там SQLite на диске (см. DEPLOY.md).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sport_partner}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_IDS: ${ADMIN_IDS:-}
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SEARCH_LIMIT_PER_MINUTE: ${SEARCH_LIMIT_PER_MINUTE:-60}
      CONTACT_LIMIT_PER_MINUTE: ${CONTACT_LIMIT_PER_MINUTE:-5}
      CONTACT_LIMIT_PER_DAY: ${CONTACT_LIMIT_PER_DAY:-30}
      # Overrides whatever is in .env: inside the network the host is "db".
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-sport_partner}?schema=public

volumes:
  pgdata:
