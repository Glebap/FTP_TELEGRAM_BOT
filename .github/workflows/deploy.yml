# Deploys the bot to Fly.io from GitHub's runners.
#
# This is the supported path on machines where flyctl cannot run (Windows with
# Smart App Control blocks the unsigned flyctl binary, and building the image
# needs Docker). Everything here runs on GitHub's Linux runner instead.
#
# Repository secrets required:
#   FLY_API_TOKEN — Fly organization token with full access to the org
#   BOT_TOKEN     — token from @BotFather
#   ADMIN_IDS     — comma-separated Telegram ids allowed to run /admin
name: Deploy to Fly.io

on:
  push:
    branches: [main, master]
    # Documentation-only changes do not need a redeploy.
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  # Two deploys at once would leave two bots polling the same token.
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Provision and deploy
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ftp-telegram-bot
      FLY_REGION: fra
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check the token works
        run: flyctl auth whoami

      - name: Create the app if it does not exist
        run: |
          if flyctl status --app "$FLY_APP" >/dev/null 2>&1; then
            echo "app $FLY_APP already exists"
          else
            flyctl apps create "$FLY_APP" --org hcernij-gmail-com
          fi

      - name: Create the data volume if it does not exist
        run: |
          # SQLite lives on this volume, so it must survive redeploys.
          if flyctl volumes list --app "$FLY_APP" | grep -q '\bdata\b'; then
            echo "volume data already exists"
          else
            flyctl volumes create data \
              --app "$FLY_APP" \
              --region "$FLY_REGION" \
              --size 1 \
              --yes
          fi

      - name: Push the bot secrets
        if: ${{ env.HAS_BOT_TOKEN == 'true' }}
        env:
          HAS_BOT_TOKEN: ${{ secrets.BOT_TOKEN != '' }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
        run: |
          # No --stage here: staged secrets are not injected into a machine
          # that is created by the deploy right after, and the bot then starts
          # without BOT_TOKEN and crash-loops.
          flyctl secrets set \
            "BOT_TOKEN=$BOT_TOKEN" \
            "ADMIN_IDS=$ADMIN_IDS" \
            --app "$FLY_APP"

      - name: Check the secrets are in place and applied
        run: |
          # The bot cannot start without these, so fail loudly and early.
          for name in BOT_TOKEN ADMIN_IDS; do
            if ! flyctl secrets list --app "$FLY_APP" | grep -q "$name"; then
              echo "::error::secret $name is missing — add it in the Fly app or as a repository secret"
              exit 1
            fi
          done

          # A secret can sit in the store as "Staged" and never reach the
          # machine — that is exactly how the first deploy produced a bot
          # crash-looping on a missing BOT_TOKEN. Setting an unchanged value
          # creates no release, so staged secrets have to be pushed explicitly.
          if flyctl secrets list --app "$FLY_APP" | grep -q Staged; then
            echo 'staged secrets found, deploying them'
            flyctl secrets deploy --app "$FLY_APP"
          fi

          flyctl secrets list --app "$FLY_APP"

      - name: Deploy
        # --remote-only builds the image on Fly's builder, no local Docker.
        run: flyctl deploy --app "$FLY_APP" --remote-only

      - name: Make sure the machine is running
        run: |
          # A machine that was stopped once stays stopped across deploys: Fly
          # only updates its config and expects an HTTP request to wake it up.
          # A polling bot never gets one, so it has to be started explicitly.
          flyctl machine list --app "$FLY_APP" --json \
            | jq -r '.[] | select(.state != "started") | .id' \
            | while read -r id; do
                [ -n "$id" ] || continue
                echo "starting machine $id"
                flyctl machine start "$id" --app "$FLY_APP"
              done

          flyctl machine list --app "$FLY_APP"

      - name: Verify the bot actually started
        run: |
          # `flyctl logs --no-tail` returns recent history, which still holds
          # lines from the previous release — matching those would report a
          # failure that has already been fixed. So only lines newer than this
          # deploy count, and the machine state is checked as well.
          since=$(date -u +%s)

          for attempt in $(seq 1 12); do
            sleep 10
            timeout 25 flyctl logs --app "$FLY_APP" --no-tail > /tmp/fly.log 2>&1 || true

            # Keep only lines stamped after the deploy started.
            awk -v since="$since" '
              match($0, /20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]T[0-9][0-9]:[0-9][0-9]:[0-9][0-9]/) {
                stamp = substr($0, RSTART, RLENGTH)
                gsub(/[-T:]/, " ", stamp)
                if (mktime(stamp) >= since - 5) print
              }
            ' /tmp/fly.log > /tmp/fly-new.log || cp /tmp/fly.log /tmp/fly-new.log

            if grep -q 'Bot is running' /tmp/fly-new.log; then
              echo 'the bot reported itself as running'
              flyctl status --app "$FLY_APP"
              exit 0
            fi
            if grep -qE 'Invalid environment configuration|Fatal startup error' /tmp/fly-new.log; then
              echo '::error::the bot crashed on startup'
              tail -40 /tmp/fly-new.log
              exit 1
            fi
            echo "attempt $attempt: no startup line yet"
          done

          echo '::error::the bot never reported "Bot is running"'
          flyctl status --app "$FLY_APP" || true
          tail -60 /tmp/fly.log
          exit 1

      - name: Show the result
        if: always()
        run: |
          flyctl status --app "$FLY_APP" || true
          echo '--- last log lines ---'
          timeout 30 flyctl logs --app "$FLY_APP" --no-tail || true
