# fly.toml app configuration file generated for ftp-telegram-bot on 2026-09-10T09:36:11Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ftp-telegram-bot'
primary_region = 'fra'

[build]

[deploy]
  strategy = 'immediate'

[env]
  CONTACT_LIMIT_PER_DAY = '30'
  CONTACT_LIMIT_PER_MINUTE = '5'
  DATABASE_URL = 'file:/data/dev.db'
  DIGEST_ENABLED = 'true'
  DIGEST_TIMES = '10:00,19:00'
  DIGEST_TIMEZONE = 'Europe/Chisinau'
  LOG_LEVEL = 'info'
  NODE_ENV = 'production'
  SEARCH_LIMIT_PER_MINUTE = '60'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
